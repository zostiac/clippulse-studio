<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipPulse Studio</title>
    <meta
      name="description"
      content="Turn long videos into captioned 9:16 shorts. Find the best moments, trim them, and export."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("clippulse-theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-accent/25">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
